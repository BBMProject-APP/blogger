name: OpenToonz Feeder Blogger Automation

on:
  schedule:
    # Jalan setiap jam 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-feeder:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth-oauthlib python-dotenv

      - name: Run OpenToonz Feeder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python script_opentoonz.py

      - name: Commit & Push JSON Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update opentoonz data JSON [auto]"
          file_pattern: "opentoonz_data.json"
